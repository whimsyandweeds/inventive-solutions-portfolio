<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Whimsy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;background:#14110e;color:#f6f1e8;font-family:Inter,sans-serif}
  #door{min-height:100vh;display:grid;place-items:center;background:radial-gradient(800px 420px at 50% 38%,rgba(92,74,58,.45),transparent 62%),#14110e}
  form{width:min(380px,calc(100% - 40px));padding:36px 32px 28px;border:1px solid rgba(196,164,122,.45);border-radius:22px;background:rgba(20,17,14,.92);box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .mark{font-size:13px;letter-spacing:.22em;color:#c4a47a}
  h1{margin:10px 0 22px;font-size:28px;font-weight:500}
  label{display:block;font-size:12px;color:#a89880;margin-bottom:8px}
  input{width:100%;box-sizing:border-box;background:#0e0c0a;color:#fff;border:1px solid #3a3228;border-radius:12px;padding:14px 12px;font-size:16px}
  input:focus{outline:none;border-color:#c4a47a}
  button{width:100%;margin-top:16px;background:#6b4f36;color:#f6f1e8;border:0;border-radius:12px;padding:14px;font-size:15px}
  #door.bad{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #sheet{display:none;background:#efe8dc}
  #sheet img{width:min(920px,100%);display:block;margin:0 auto}#jump{position:fixed;left:72px;bottom:16px;z-index:40;width:78px;height:78px;padding:6px;border:0;border-radius:50%;background:#efe8dc;box-shadow:0 12px 24px rgba(0,0,0,.5);cursor:pointer}#jump img{width:74px;height:74px;display:block}#out{position:fixed;left:16px;bottom:16px;z-index:40;width:44px;height:44px;display:grid;place-items:center;border:1px solid #d2d2d2;border-radius:50%;background:#1a1a1c;text-decoration:none}
</style>
</head>
<body>
<div id="door">
  <form id="door-form">
    <p class="mark">WHIMSY</p>
    <h1>Your page</h1>
    <label for="code">Code</label>
    <input id="code" autocomplete="off" />
    <button type="submit">Enter</button>
  </form>
</div>
<div id="sheet"><a id="out" href="../" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#d2d2d2" stroke-width="1.8"><path d="M14 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h7"/><path d="M10 12h10"/><path d="M16 8l4 4-4 4"/></svg></a><img src="docket-sheet.jpg" alt="Docket Date" /></div>
<script>
if(location.search.indexOf("open=1")>-1){document.getElementById("door").style.display="none";document.getElementById("sheet").style.display="block";}
document.getElementById("door-form").addEventListener("submit", function(e){
  e.preventDefault();
  var code=(document.getElementById("code").value||"").trim();
  if(code.toLowerCase()==="docket"){
    document.getElementById("door").style.display="none";
    document.getElementById("sheet").style.display="block";
  } else if(code==="Yomama369"){
    location.href="../";
  } else {
    document.getElementById("code").value="";
    var door=document.getElementById("door");
    door.classList.remove("bad");
    void door.offsetWidth;
    door.classList.add("bad");
  }
});
</script>
</body>
</html>
