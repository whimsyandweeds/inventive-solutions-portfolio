<!DOCTYPE html>
<html lang="en">
<head>

<title>Inventive Solutions — Portfolio Pipeline</title>

<body>
<p>Putting the board back.</p>
<script>
fetch('https://raw.githubusercontent.com/whimsyandweeds/inventive-solutions-portfolio/a0c354633d010553474d624dca1e767411ef6d77/index.html')
.then(function(r){return r.text();})
.then(function(t){
  var m=t.match(/<div id="sure"[\s\S]*?<\/div>\s*<\/div>\s*<\/div>/);
  if(m){
    t=t.replace(m[0],'');
    t=t.replace('<script>', m[0]+'\n<script>');
  }
  var extra='<style>#cal-stops a.pin{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-left:.35rem;border-radius:50%;border:1px solid #2ec4b6;color:#2ec4b6;text-decoration:none;font-size:.7rem;vertical-align:middle;}#cal-stops div{align-items:center;}#market .buy button:not(.drop), #shop .step{background:transparent;color:#a855f7;border:1px solid #a855f7;box-shadow:none;}#market .buy i, #shop .sku .n{background:transparent;color:#a855f7;border:1px solid #a855f7;}</style><script>function pinStops(){document.querySelectorAll("#cal-stops [data-row]").forEach(function(row){var old=row.querySelector("a.pin");if(old)old.remove();if(row.classList.contains("off"))return;var loc=(row.querySelector("span")||{}).textContent||"";if(!loc||loc==="—"||loc==="Empty")return;var a=document.createElement("a");a.className="pin";a.href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(loc+", Henderson NV");a.target="_blank";a.rel="noopener";a.title="Open in Maps";a.textContent="\u{1F4CD}";var b=row.querySelector("b");if(b)b.after(a);});}pinStops();document.getElementById("days")&&document.getElementById("days").addEventListener("click",function(){setTimeout(pinStops,30);});document.querySelectorAll("#stops input").forEach(function(inp){inp.addEventListener("input",function(){setTimeout(pinStops,30);});});<\/script>';
  t=t.replace('</body>', extra+'</body>');
  document.open(); document.write(t); document.close();
})
.catch(function(){document.body.textContent='Restore failed. Hard-refresh once more.';});
</script>
</body>
</html>
