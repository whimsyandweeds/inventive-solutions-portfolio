async function openBoard(password) {
  const material = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:SALT, iterations:250000, hash:"SHA-256" },
    material,
    { name:"AES-GCM", length:256 },
    false,
    ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name:"AES-GCM", iv:IV }, key, CT);
  const html = new TextDecoder().decode(plain);
  document.open();
  document.write(html);
  document.close();
}
const form = document.getElementById("gate");
const err = document.getElementById("err");
const saved = sessionStorage.getItem("is-board");
if (saved) openBoard(saved).catch(() => sessionStorage.removeItem("is-board"));
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.textContent = "Checking…";
  const password = document.getElementById("pw").value;
  try {
    await openBoard(password);
    sessionStorage.setItem("is-board", password);
  } catch (ex) {
    err.textContent = "Wrong password.";
  }
});
</script>
