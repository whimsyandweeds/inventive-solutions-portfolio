<script>
(function(){
  var picked={};
  function boot(){
    var ul=document.querySelector("ul.grid");
    if(!ul||!ul.children.length) return setTimeout(boot,200);
    if(document.getElementById("cart-sheet")) return;
    Array.from(ul.children).forEach(function(li){
      var span=li.querySelector("span.mono");
      if(!span) return;
      var raw=span.textContent;
      var cut=raw.lastIndexOf("—");
      var name=cut>-1?raw.slice(0,cut).trim():raw;
      var price=cut>-1?raw.slice(cut+1).trim():"";
      var n=document.createElement("span");
      n.textContent=name; n.style.flex="1";
      var p=document.createElement("span");
      p.textContent=price; p.className="price-pill";
      span.replaceWith(n); li.appendChild(p); li.style.cursor="pointer";
      li.onclick=function(){ if(picked[name]) delete picked[name]; else picked[name]=price; li.classList.toggle("on", !!picked[name]); draw(); if(/chatbot/i.test(name)){var bot=document.getElementById("bot"); if(bot) bot.click();} };
    });
    var sheet=document.createElement("div");
    sheet.id="cart-sheet";
    sheet.innerHTML='<div class="cart-top"><span id="cart-line">Tap a line to add it</span><button id="cart-open" type="button">Send to Tonya</button></div><form id="cart-form" hidden action="https://formsubmit.co/whimsyandweeds@gmail.com" method="POST" target="silent-note"><input type="hidden" name="_subject" value="Farmers market pricing"><input type="hidden" name="_captcha" value="false"><input type="hidden" name="_template" value="table"><input id="cart-items" type="hidden" name="items"><input name="business" placeholder="Business name" required><input name="phone" placeholder="Phone" required><input name="email" type="email" placeholder="Email" required></form><iframe name="silent-note" hidden></iframe><div id="sent-pop" hidden>Sent to Tonya</div>';
    document.body.appendChild(sheet);
    document.getElementById("cart-open").onclick=function(){
      var form=document.getElementById("cart-form");
      if(!Object.keys(picked).length) return;
      if(form.hidden){ form.hidden=false; return; }
      if(!form.checkValidity()){ form.reportValidity(); return; }
      document.getElementById("cart-items").value=Object.keys(picked).map(function(n){return n+" — "+picked[n];}).join(", ")+" | Total $"+total();
      form.submit();
      var pop=document.getElementById("sent-pop");
      pop.hidden=false;
      setTimeout(function(){ pop.hidden=true; form.hidden=true; form.reset(); }, 2200);
    };
    draw();
  }
  function total(){return Object.values(picked).reduce(function(s,p){return s+Number((p||"").replace(/[^0-9]/g,""))},0)}
  function draw(){ var line=document.getElementById("cart-line"); var names=Object.keys(picked); if(line) line.textContent=names.length?names.length+" picked · $"+total():"Tap a line to add it"; }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
<style>
.price-pill{margin-left:auto;border:1px solid rgba(61,232,255,.55);color:#3de8ff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700;letter-spacing:.04em;white-space:nowrap;background:rgba(61,232,255,.1)}
ul.grid li.on{border-color:rgba(61,232,255,.55)!important;box-shadow:0 0 18px rgba(61,232,255,.25)}
#cart-sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:rgba(8,15,32,.94);border-top:1px solid rgba(61,232,255,.35);padding:12px 14px calc(14px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
.cart-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
#cart-line{color:#eaf2ff;font-size:14px}
#cart-open{border:0;background:#3de8ff;color:#04202a;border-radius:999px;padding:10px 16px;font-weight:700}
#cart-form{display:grid;gap:8px;margin-top:12px}
#cart-form[hidden]{display:none}
#cart-form input{border:1px solid rgba(61,232,255,.3);background:#0a1226;color:#fff;border-radius:10px;padding:10px 12px}
#sent-pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:90;background:#3de8ff;color:#04202a;border-radius:16px;padding:18px 22px;font-weight:700;box-shadow:0 0 30px rgba(61,232,255,.45)}
#sent-pop[hidden]{display:none}
body{padding-bottom:84px}#bot{bottom:108px;z-index:80}#chat{z-index:80}
</style>



<script>
(function(){
  function boot(){
    var nodes=document.querySelectorAll("button,a");
    var btn=null;
    for(var i=0;i<nodes.length;i++){ if(nodes[i].textContent.indexOf("See Full Pricing")>-1){ btn=nodes[i]; break; } }
    if(!btn) return setTimeout(boot,200);
    if(document.getElementById("ad-pricing")) return;
    var link=document.createElement("a");
    link.id="ad-pricing";
    link.href="/ads/";
    link.textContent="See Full Ad Pricing";
    link.style.cssText="display:flex;align-items:center;justify-content:center;gap:8px;margin:14px auto 0;width:min(280px,calc(100% - 48px));background:#3de8ff;color:#04202a;border-radius:999px;padding:14px 22px;font-weight:700;text-decoration:none;box-shadow:0 0 28px rgba(61,232,255,.7),0 0 80px rgba(61,232,255,.35)";
    btn.parentNode.insertBefore(link, btn.nextSibling);
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
